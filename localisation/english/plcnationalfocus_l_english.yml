l_english:
 PLC_settle_the_monarchy:0 "Settle The Monarchy"
 PLC_settle_the_monarchy_desc:0 "It's time to finally act. The civil war inches closer and we haven't progressed since the first one."

 PLC_coronate_braun:0 "Coronate Braun"
 PLC_coronate_braun_desc:0 "All hail Grzegorz I! We've established a monarchy system, now it's time to pick an actual monarch. Braun is the only logical option."

 PLC_the_poznan_conference:0 "The Poznań Conference"
 PLC_the_poznan_conference_desc:0 "Perhaps there is a different way to settle our conflict with Mentzen. We should unite our arms for a final battle against Tusk. Let us suggest a conference in Poznań."

 PLC_challenge_mentzen:0 "Challenge Mentzen"
 PLC_the_poznan_conference_desc:0 "How does Mentzen dare mock our authority? We might be unprepared but so are all of them. It's all or nothing."

 PLC_fortify_bialystok:0 "Fortify Białystok"
 PLC_fortify_bialystok_desc:0 "We cannot let Nawrocki take our capital. Białystok desperately needs defense modernizations. We must develop forts both inside the city and in the region itself."

 PLC_prepare_a_western_enclave:0 "Prepare a Western Enclave"
 PLC_prepare_a_western_enclave_desc:0 "To unite Poland we need Silesia. We are both the minorities in the civil war. It's time to plan for a union."

 PLC_operation_giewont:0 "Operation Giewont"
 PLC_operation_giewont_desc:0 "There is no point in any diplomatic action with Sutryk. It's war or nothing."

 PLC_the_braun_sutryk_coalition:0 "The Braun-Sutryk Coalition"
 PLC_the_braun_sutryk_coalition_desc:0 "We can negotiate a coalition with Silesia. A peaceful merging would waste less resources than a full invasion."

 PLC_establish_the_sudeten_office:0 "Establish the Sudeten Office"
 PLC_establish_the_sudeten_office_desc:0 "Creating a governing body in Silesia will help us integrate them into our monarchy quicker."

 PLC_integrate_silesia:0 "Integrate Silesia"
 PLC_integrate_silesia_desc:0 "It's time to fully integrate Silesia into Braun's Poland."

 PLC_taking_over_the_right:0 "Taking Over the Right"
 PLC_taking_over_the_right_desc:0 "Nawrocki's luck has ran out. It's time to prove everyone wrong."

 PLC_attempt_to_allign_the_republic:0 "Attempt to Allign the Republic"
 PLC_attempt_to_allign_the_republic_desc:0 "We've taken over the Right. Perhaps Tusk will fold under our pressure."

 PLC_pacify_tusk:0 "Pacify Tusk"
 PLC_pacify_tusk_desc:0 "There is no other way. Tusk's regime dies with us. The civil war is almost done."

 PLC_a_new_economic_capital:0 "A New Economic Capital"
 PLC_a_new_economic_capital_desc:0 "With hopes of a new alliance come different priorities. Białystok is barren of any significant economic centres. We should change that."

 PLC_united_right:0 "United Right"
 PLC_united_right_desc:0 "To defeat Tusk we must once more unite our forces. It's time for a United Right."

 PLC_the_plock_gala:0 "The Płock Gala"
 PLC_the_plock_gala_desc:0 "Surely Tusk is starting to doubt his chances in the war after our alliance. Let's schedule a meeting and negotiate a deal."

 PLC_deploy_operation_fang:0 "Deploy Operation Fang"
 PLC_deploy_operation_fang_desc:0 "Tusk's resiliance is stunning. Luckily, he is not resiliant to lead. We have a special operations squadron ready to deploy and finish Tusk at any moment."

 PLC_retake_warsaw:0 "Retake Warsaw"
 PLC_retake_warsaw_desc:0 "With Tusk dead, the only thing left is to march to Warsaw and get rid of Tusk's government. Who would've thought the civil war can be avoided."

 PLC_pacify_nawrocki:0 "Pacify Nawrocki"
 PLC_pacify_nawrocki_desc:0 "Tusk surrendered. Now it's time for Nawrocki. Our alliance with the Right ends here."

 PLC_the_second_warsaw_conference:0 "The Second Warsaw Conference"
 PLC_the_second_warsaw_conference_desc:0 "And so the civil war is over. Now it's time to create a peace agreement. Poland is finally together once more."

 PLC_execute_the_traitors:0 "Execute the Traitors"
 PLC_execute_the_traitors_desc:0 "The opposition was working against the country. This level of treason cannot be forgiven by any sentence. The fire squads are off."

 PLC_the_warsaw_trials:0 "The Warsaw Trials"
 PLC_the_warsaw_trials_desc:0 "With Tusk finally crushed. It's time for justice. Him and his associates need to be judged and sentenced."

 PLC_a_new_chapter:0 "A New Chapter"
 PLC_a_new_chapter_desc:0 "We are finally past a depressing time in our nation's history. Brother against brother, we irrationally fought for power. I'm glad this has finally came to a close, and that we were the ones who won. Our rule will bring peace to Poland, once and for all."

 PLC_establish_a_kingdom:0 "Establish a Kingdom"
 PLC_establish_a_kingdom_desc:0 "In the end, the best direction for Poland is it's original one. The monarchy must be brough back. With me as it's king, noone will dare challenge our sovereignty."

 PLC_revenge_for_1939:0 "Revenge for 1939"
 PLC_revenge_for_1939_desc:0 "The West is in shambles while we are our best selves! Remember what they did to us when we needed their help the most? They left us to ourselves and look what pain that caused us? Poland is the new big player in Europe. We should exploit that fact and finally deliver some payback. There is no step back."

 PLC_polish_gold:0 "A Golden Poland"
 PLC_polish_gold_desc:0 "My dream of the monarchy expands beyond a kingdom. We were forever destined to be greater, but our enemies took that greatness from us. We must reform Poland to the state it was in it's peak. The Commonwealth must shine."

 PLC_revitalize_national_spirit:0 "Revitalize National Spirit"
 PLC_revitalize_national_spirit_desc:0 "Man the guns and man the factories! Be proud to be Polish and be proud of being a part of its rebirth! We are the saviours of Europe."

 PLC_our_eternal_enemy:0 "Our Eternal Enemy"
 PLC_our_eternal_enemy_desc:0 "The Germans have been a burden for us since the dawn of our history. The tables have turned now. It's our time to shine."

 PLC_viva_polonia:0 "Viva Polonia"
 PLC_viva_polonia_desc:0 "When Germany attacked us, we counted on the help of the allies. What did they do to help us? Nothing! Exactly. The French sat back and watched as our country collapsed. Now that's coming back to get them. This is the end of the French Republic."

 PLC_the_march_to_minsk:0 "The March to Minsk"
 PLC_the_march_to_minsk_desc:0 "It's well known that Belarus belonged to the Commonwealth for centuries. They should be happy to be apart of our new, perfect nation."

 PLC_fate_of_ukraine:0 "Fate of Ukraine"
 PLC_fate_of_ukraine_desc:0 "Ukraine is already weakened from Tusk's attacks and the Russian war. It's either war or submission. They stand no chance against us."

 PLC_friends_by_force:0 "Friends by Force"
 PLC_friends_by_force_desc:0 "Lithuania cannot win a war with us in any way. We might aswell assert our dominance and mobilize the army."

 PLC_second_polish_lithuanian_union:0 "Second Polish-Lithuanian Union"
 PLC_second_polish_lithuanian_union_desc:0 "We've always been good friends with Lithuania. This is the dawn of the Second Polish-Lithuanian Commonwealth. We must sign a union."

 PLC_crackdown_on_bavaria:0 "Crackdown on Bavaria"
 PLC_crackdown_on_bavaria_desc:0 "Another step in a Polish Germany. Bavaria is the next logical step after the German Republic."

 PLC_polish_berlin:0 "Polish Berlin"
 PLC_polish_berlin_desc:0 "And so Berlin is ours! We've showed them what we can do when we are united."

 PLC_incorporate_france:0 "Incorporate France"
 PLC_incorporate_france_desc:0 "Well, this is the end of France. Who would've thought that a time where we control the west will ever come. France belongs to Poland now."

 PLC_french_enclave:0 "French Enclave"
 PLC_french_enclave_desc:0 "France fell to Poland. Such a waste of their resources. They don't even deserve to be apart of Poland. We must make a french puppet state."

 PLC_expand_the_monarch_authority:0 "Expand the Monarch Authority"
 PLC_expand_the_monarch_authority_desc:0 "With the rise of the Kingdom of Poland, we must prioritize the power of our king, Grzegorz. He is our only light. Our only leader."

 PLC_lean_towards_the_nobility:0 "Lean Towards the Nobility"
 PLC_lean_towards_the_nobility_desc:0 "With the rise of the Kingdom of Poland, we should spread our power amongst the elite. Afterall, they are the motors to our country and it's economics. The new nobility will serve well as the King's closest advisors."

 PLC_establish_the_kievan_office:0 "Establish the Kievan Office"
 PLC_establish_the_kievan_office_desc:0 "With the fall of Ukraine, our territory is expanded by a significant margin. A governing body in Kiev will strengthen our authority there aswell as in Belarus."

 PLC_develop_the_monarchy_in_lithuania:0 "Develop the Monarchy in Lithuania"
 PLC_develop_the_monarchy_in_lithuania_desc:0 "Lithuania is our closest friend. We must put extra effort in expanding our reach to control them."

 PLC_integrate_the_eastern_block:0 "Integrate the Eastern Block"
 PLC_integrate_the_eastern_block_desc:0 "With Ukraine and Belarus incorporated into Poland it's time to fully integrate them into our nation. They are now Poles and they work for the Polish monarchy."
 

 PLC_empire_of_the_sun:0 "Empire of the Sun"
 PLC_empire_of_the_sun_desc:0 "Now, see, You don't get it, alright? These people have been opressing us for centuries. Centuries! And through God's Light I see us finally paying them all back."

 PLC_the_eagle_forever:0 "The Eagle Forever"
 PLC_the_eagle_forever_desc:0 "We've crushed Europe, everyone! All of western scum bow under our power. After what they've done to us, we finally showed them our Polish spirit. This is the dawn of the Polish Europe. Now, party and cherish this, ladies and gentlemen, for our empire is eternal."

 PLC_a_new_european_union:0 "A New European Union"
 PLC_a_new_european_union_desc:0 "Well, ladies and gentlemen. We've done it. Europe is once more united. It's about time for a revival of the European Union. We shall progress through prosperity."

 PLC_the_grand_alliance:0 "The Grand Alliance"
 PLC_the_grand_alliance_desc:0 "Alas, Europe belongs to us. It's time to make a change after the pandemic. We should abandon the ideas of the European Union and establish a new, economical and military alliance. None of this war should happen, ever."