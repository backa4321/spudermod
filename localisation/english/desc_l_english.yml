l_english:
PLC_pandemic_desc:0 "Following the Polish Civil War, Grzegorz Braun and his party broke apart from the United Right and settled in Podlasie. Braun's dream is to turn Poland into a monarchic state. With a rematch of the civil war looming over the region, his ideal Poland might come true."
RPL_pandemic_desc:0 "The Polish Front comprised primarily of right-winged politicians are the last bastion of democracy in Poland. Led by Karol Nawrocki, their goal is to bring the nation back into order."
POL_pandemic_desc:0 "The Republic of Poland led by Donald Tusk following the overturn of the government wants to take revenge after their loss in the First Polish Civil War. Tusk ultimately wants to turn Poland into a state with totalitarian rule."